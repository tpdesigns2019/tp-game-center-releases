# Publishes a TP Game Center release when a "release/<version>" branch is pushed.
# The branch holds the installer split into parts (GitHub won't take one 87 MB file comfortably),
# latest.yml, the blockmap, SHA256 and NOTES.md. This job joins the parts, checks the checksum,
# creates the GitHub release with the three files the auto-updater needs, then deletes the branch.
name: Publish release
on:
  push:
    branches: ['release/**']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Join installer and verify
        run: |
          set -euo pipefail
          V="${GITHUB_REF_NAME#release/}"
          EXE="TP-Game-Center-Setup-$V.exe"
          cat $(ls "$EXE".part* | sort) > "$EXE"
          echo "$(cat SHA256)  $EXE" | sha256sum -c -
          grep -q "^version: $V$" latest.yml
          echo "V=$V" >> "$GITHUB_ENV"; echo "EXE=$EXE" >> "$GITHUB_ENV"
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "v$V" "$EXE" "$EXE.blockmap" latest.yml \
            --title "TP Game Center $V" --notes-file NOTES.md --target main --latest
      - name: Remove the upload branch
        if: success()
        run: git push origin --delete "$GITHUB_REF_NAME"
