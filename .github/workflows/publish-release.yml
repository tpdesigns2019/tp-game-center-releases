# Publishes a TP Game Center release when a "release/<version>" branch is pushed.
# The branch holds the installer split into parts (GitHub won't take one 87 MB file comfortably),
# latest.yml, the blockmap, SHA256 and NOTES.md. This job joins the parts, checks the checksum,
# creates the GitHub release with the three files the auto-updater needs, then deletes the branch.
name: Publish release
on:
  push:
    branches: ['release/**']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Join installer and verify
        run: |
          set -uo pipefail
          V="${GITHUB_REF_NAME#release/}"
          EXE="TP-Game-Center-Setup-$V.exe"
          echo "version=$V"; ls -la
          parts=$(ls "$EXE".part* 2>/dev/null | sort)
          [ -n "$parts" ] || { echo "::error::No installer parts found for $EXE"; exit 1; }
          cat $parts > "$EXE" || { echo "::error::Could not join parts"; exit 1; }
          got=$(sha256sum "$EXE" | cut -d' ' -f1); want=$(tr -d ' \r\n' < SHA256)
          [ "$got" = "$want" ] || { echo "::error::Checksum mismatch got=$got want=$want"; exit 1; }
          grep -q "^version: $V\$" latest.yml || { echo "::error::latest.yml is not for $V: $(head -1 latest.yml)"; exit 1; }
          echo "V=$V" >> "$GITHUB_ENV"; echo "EXE=$EXE" >> "$GITHUB_ENV"
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          out=$(gh release create "v$V" "$EXE" "$EXE.blockmap" latest.yml \
            --title "TP Game Center $V" --notes-file NOTES.md --target main --latest 2>&1) || { echo "::error::gh release create failed: $(echo "$out" | tail -3 | tr '\n' ' ')"; exit 1; }
          echo "$out"
      - name: Remove the upload branch
        if: success()
        run: git push origin --delete "$GITHUB_REF_NAME"
